[project]
name = "ogcaibb-hub"
version = "0.1.0"
description = "Ingestion + retrieval service for ogcaibb trace chunks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Piotr Zaborowski" },
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "rich>=13.9",
    "typer>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]
qdrant = [
    "qdrant-client>=1.10",
]

[project.scripts]
ogcaibb-hub = "ogcaibb_hub.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ogcaibb_hub"]

[tool.ruff]
line-length = 100
target-version = "py311"
